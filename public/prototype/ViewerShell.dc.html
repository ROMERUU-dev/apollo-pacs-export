<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</helmet>

<div style="width:100%; height:100%; min-height:320px; display:flex; flex-direction:column; background:#0b0d11; border-radius:12px; overflow:hidden; border:1px solid #20242d; font-family:'Outfit',system-ui,sans-serif;">

  <!-- Toolbar -->
  <div style="display:flex; align-items:center; gap:4px; padding:8px; background:#101319; border-bottom:1px solid #20242d; overflow-x:auto; flex-shrink:0;">
    <div onClick="{{ cycleLayout }}" style="{{ layoutBtnStyle }}">
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:2px; width:16px; height:16px;">
        <div style="background:currentColor; border-radius:1px;"></div><div style="background:currentColor; border-radius:1px;"></div>
        <div style="background:currentColor; border-radius:1px;"></div><div style="background:currentColor; border-radius:1px;"></div>
      </div>
      <span>{{ layoutLabel }}</span>
    </div>
    <div style="width:1px; height:30px; background:#20242d; margin:0 4px; flex-shrink:0;"></div>
    <div onClick="{{ selectPan }}" style="{{ s.pan }}">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 1.5v13M1.5 8h13M8 1.5l-2.2 2.2M8 1.5l2.2 2.2M8 14.5l-2.2-2.2M8 14.5l2.2-2.2M1.5 8l2.2-2.2M1.5 8l2.2 2.2M14.5 8l-2.2-2.2M14.5 8l-2.2 2.2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      <span>Mover</span>
    </div>
    <div onClick="{{ selectScroll }}" style="{{ s.scroll }}">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="3.5" y="1.5" width="9" height="13" rx="2" stroke="currentColor" stroke-width="1.3"/><path d="M8 4.5v3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      <span>Scroll</span>
    </div>
    <div onClick="{{ selectZoom }}" style="{{ s.zoom }}">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.3"/><path d="M10.8 10.8L14.5 14.5M5 7h4M7 5v4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      <span>Zoom</span>
    </div>
    <div onClick="{{ selectWl }}" style="{{ s.wl }}">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.3"/><path d="M8 2a6 6 0 010 12z" fill="currentColor"/></svg>
      <span>Ventana</span>
    </div>
    <div onClick="{{ selectMedir }}" style="{{ s.medir }}">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 11L11 2l3 3-9 9-3-3z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M5 8l1.2 1.2M7 6l1.2 1.2M9 4l1.2 1.2" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg>
      <span>Medir</span>
    </div>
    <div style="flex:1; min-width:8px;"></div>
    <div onClick="{{ reset }}" style="{{ resetBtnStyle }}">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M13 8a5 5 0 11-1.5-3.5M13 2v3h-3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Reset</span>
    </div>
  </div>

  <!-- Image grid -->
  <div style="{{ gridStyle }}">
      <sc-for list="{{ panes }}" as="pane" hint-placeholder-count="1">
        <div style="{{ pane.style }}">
          <!-- placeholder texture -->
          <div style="position:absolute; inset:0; background:repeating-linear-gradient(135deg,#0f1217 0 14px,#0a0c10 14px 28px);"></div>
          <div style="position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; color:#3a414f;">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor" stroke-width="1.2"/><circle cx="9" cy="9" r="1.6" fill="currentColor"/><path d="M21 15l-4.5-4.5L7 20" stroke="currentColor" stroke-width="1.2"/></svg>
            <span style="font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:0.05em; color:#4a5263;">Sin imagen DICOM cargada</span>
          </div>
          <!-- top-left overlay -->
          <div style="position:absolute; top:8px; left:10px; font-family:'JetBrains Mono',monospace; font-size:10px; line-height:1.5; color:#9aa3b4; text-shadow:0 1px 2px rgba(0,0,0,0.8);">
            <div style="color:#e9ebf1; font-weight:500;">{{ patientName }}</div>
            <div>{{ patientId }} · {{ modality }}</div>
            <div>{{ studyDesc }}</div>
            <div style="color:#646c7d;">SE {{ pane.se }}/4 · IM 1/120</div>
          </div>
          <!-- bottom-right overlay -->
          <div style="position:absolute; bottom:8px; right:10px; text-align:right; font-family:'JetBrains Mono',monospace; font-size:10px; line-height:1.5; color:#9aa3b4; text-shadow:0 1px 2px rgba(0,0,0,0.8);">
            <div>Zoom 100% · WL 40 / 400</div>
            <div style="display:flex; align-items:center; justify-content:flex-end; gap:6px;"><span style="display:inline-block; width:40px; height:0; border-top:2px solid #9aa3b4;"></span> 5 cm</div>
          </div>
          <!-- active marker -->
          <div style="{{ pane.marker }}"></div>
        </div>
      </sc-for>
  </div>

  <!-- Thumbnails -->
  <div style="display:flex; gap:6px; padding:8px; background:#101319; border-top:1px solid #20242d; overflow-x:auto; flex-shrink:0;">
    <sc-for list="{{ thumbs }}" as="t" hint-placeholder-count="4">
      <div onClick="{{ t.select }}" style="{{ t.style }}">
        <div style="position:absolute; inset:0; background:repeating-linear-gradient(135deg,#13161c 0 7px,#0d0f14 7px 14px);"></div>
        <span style="position:absolute; bottom:3px; left:5px; font-family:'JetBrains Mono',monospace; font-size:9px; color:#7c8597;">{{ t.label }}</span>
      </div>
    </sc-for>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:760,&quot;height&quot;:480},&quot;patientName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;GONZÁLEZ RUIZ, MARÍA&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;patientId&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;MRN-024518&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;modality&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;RX&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;studyDesc&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;RX Tórax PA&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { tool: 'pan', layout: '1x1', thumb: 0 };

  renderVals() {
    const tool = this.state.tool;
    const layout = this.state.layout;

    const base = {
      display:'flex', flexDirection:'column', alignItems:'center', gap:3,
      padding:'6px 9px', borderRadius:8, cursor:'pointer', color:'#98a1b2',
      background:'transparent', border:'1px solid transparent', minWidth:50,
      fontSize:10.5, fontWeight:500, flexShrink:0, userSelect:'none',
      transition:'background .12s, color .12s, border-color .12s', whiteSpace:'nowrap',
    };
    const active = { ...base, color:'#c9c2ff', background:'rgba(124,108,255,0.16)', border:'1px solid rgba(124,108,255,0.45)' };
    const ts = id => id === tool ? active : base;

    const s = { pan: ts('pan'), scroll: ts('scroll'), zoom: ts('zoom'), wl: ts('wl'), medir: ts('medir') };

    const grids = {
      '1x1': { c:'1fr', r:'1fr', n:1 },
      '1x2': { c:'1fr 1fr', r:'1fr', n:2 },
      '2x2': { c:'1fr 1fr', r:'1fr 1fr', n:4 },
    };
    const g = grids[layout];
    const gridStyle = {
      display:'grid', flex:'1', minHeight:0, gap:6, padding:6, background:'#070809',
      gridTemplateColumns:g.c, gridTemplateRows:g.r,
    };
    const paneBase = { position:'relative', background:'#060708', borderRadius:6, overflow:'hidden', minHeight:0, minWidth:0 };
    const panes = Array.from({length:g.n}, (_,i) => ({
      se: i+1,
      style: { ...paneBase, boxShadow: i===0 ? 'inset 0 0 0 1px rgba(124,108,255,0.55)' : 'inset 0 0 0 1px #1a1e26' },
      marker: { position:'absolute', top:0, left:0, width:'100%', height:2, background: i===0 ? '#7c6cff' : 'transparent' },
    }));

    const thumbBase = { position:'relative', width:62, height:62, borderRadius:5, overflow:'hidden', cursor:'pointer', flexShrink:0, transition:'box-shadow .12s' };
    const thumbs = ['SE 1','SE 2','SE 3','SE 4','AP'].map((label,i) => ({
      label,
      style: { ...thumbBase, boxShadow: i===this.state.thumb ? 'inset 0 0 0 2px #7c6cff' : 'inset 0 0 0 1px #20242d' },
      select: () => this.setState({ thumb:i }),
    }));

    return {
      patientName: this.props.patientName ?? 'GONZÁLEZ RUIZ, MARÍA',
      patientId: this.props.patientId ?? 'MRN-024518',
      modality: this.props.modality ?? 'RX',
      studyDesc: this.props.studyDesc ?? 'RX Tórax PA',
      s, gridStyle, panes, thumbs,
      layoutLabel: layout,
      layoutBtnStyle: { ...base, color:'#c9c2ff', minWidth:54 },
      resetBtnStyle: base,
      selectPan: () => this.setState({ tool:'pan' }),
      selectScroll: () => this.setState({ tool:'scroll' }),
      selectZoom: () => this.setState({ tool:'zoom' }),
      selectWl: () => this.setState({ tool:'wl' }),
      selectMedir: () => this.setState({ tool:'medir' }),
      cycleLayout: () => this.setState(st => ({ layout: st.layout==='1x1'?'1x2':st.layout==='1x2'?'2x2':'1x1' })),
      reset: () => this.setState({ tool:'pan', layout:'1x1', thumb:0 }),
    };
  }
}
</script>
</body>
</html>
